<title>3SET</title>
<style>
:root{color-scheme:dark;--bg:#0c0d10;--ink:#f7f7f6;--muted:#9b9ca5;--card:#17181d;--line:#2c2d32;--red:#ff5862;--yellow:#f8c64b;--green:#48dc88;--accent:var(--red);--accent-rgb:255,88,98;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid white;outline-offset:4px}button:active{transform:scale(.98)}.app{max-width:510px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 24px max(48px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding-top:24px}h1{font-size:34px;line-height:1.15;font-weight:900;letter-spacing:-1.6px;margin:0}.bell{display:grid;place-items:center;background:#1b1c20;color:var(--ink);width:54px;height:54px;border:1px solid #323339;border-radius:17px;position:relative}.bell svg{width:25px;height:25px}.bell.is-on::after{content:"";position:absolute;right:11px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--green);border:2px solid var(--card)}
.hero{text-align:center;min-height:335px;padding:12px 0 6px;display:flex;align-items:center;justify-content:center;flex-direction:column}.character{width:min(74vw,300px);max-width:300px;height:auto;display:block;filter:drop-shadow(0 18px 39px rgba(var(--accent-rgb),.12));transition:filter .25s ease}.halo{fill:rgba(var(--accent-rgb),.11)}.aura{stroke:rgba(var(--accent-rgb),.22)}.face{fill:var(--accent);transition:fill .23s ease}.eye{fill:#121417}.shine{fill:rgba(255,255,255,.5)}.mouth{stroke:#111316;stroke-width:11;stroke-linecap:round;fill:none}.status{font-weight:900;letter-spacing:-1.4px;font-size:clamp(30px,7.6vw,39px);line-height:1.15;margin:0 0 4px}.subtitle{color:var(--muted);font-size:18px;font-weight:650;margin:0}.hero[data-state="partial"]{--accent:var(--yellow);--accent-rgb:248,198,75}.hero[data-state="done"]{--accent:var(--green);--accent-rgb:72,220,136}.hero[data-state="none"] .mouth-partial,.hero[data-state="none"] .mouth-done,.hero[data-state="none"] .brow-partial,.hero[data-state="none"] .brow-done{display:none}.hero[data-state="partial"] .mouth-none,.hero[data-state="partial"] .mouth-done,.hero[data-state="partial"] .brow-none,.hero[data-state="partial"] .brow-done{display:none}.hero[data-state="done"] .mouth-none,.hero[data-state="done"] .mouth-partial,.hero[data-state="done"] .brow-none,.hero[data-state="done"] .brow-partial{display:none}.hero[data-state="done"] .cheek{opacity:1}.cheek{fill:#fffbdd;opacity:0;transition:opacity .2s}
.check{margin-top:12px} .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}.section-head h2{font-size:24px;font-weight:850;letter-spacing:-.85px;margin:0}.count{font-size:32px;font-weight:900;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}.count span{font-size:23px;color:#7d7e88}.set-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.set-btn{height:76px;border-radius:20px;background:#1b1c21;border:2px solid #33343c;color:#b6b6bf;font-size:20px;font-weight:850;letter-spacing:-.55px;display:flex;align-items:center;justify-content:center;gap:5px;transition:background .2s ease,border-color .2s ease,color .2s ease}.set-btn.chosen{background:rgba(var(--accent-rgb),.15);border-color:var(--accent);color:var(--accent)}.set-btn .checkmark{display:none;font-size:21px}.set-btn.chosen .checkmark{display:inline}.check[data-state="partial"]{--accent:var(--yellow);--accent-rgb:248,198,75}.check[data-state="done"]{--accent:var(--green);--accent-rgb:72,220,136}.check[data-state="none"]{--accent:var(--red);--accent-rgb:255,88,98}
.calendar-card{margin-top:32px;padding:22px 16px 19px;background:var(--card);border-radius:26px;border:1px solid #26272d}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding:0 2px}.calendar-head h2{margin:0;font-size:24px;font-weight:850;letter-spacing:-.6px}.month-controls{display:flex;align-items:center;gap:10px}.month-controls span{font-size:18px;font-weight:800;min-width:88px;text-align:center;letter-spacing:-.5px}.month-btn{width:35px;height:38px;border:none;border-radius:10px;background:#292a30;color:white;display:grid;place-items:center}.month-btn:disabled{opacity:.25;cursor:default}.month-btn svg{width:20px;height:20px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekdays{margin-bottom:7px}.weekdays div{height:27px;display:grid;place-items:center;color:#a6a6ae;font-size:16px;font-weight:650}.days .day{border-radius:13px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:750;color:#b9bbc4;position:relative;overflow:hidden}.day.blank{visibility:hidden}.day.future{color:#62636b}.day.today{box-shadow:inset 0 0 0 2px #dedee4;color:white}.day.partial{background:rgba(248,198,75,.16);color:var(--yellow)}.day.done{background:var(--green);color:#0c1710;font-weight:900}.day.today.done{box-shadow:inset 0 0 0 2px #fff}.day.today.partial{box-shadow:inset 0 0 0 2px var(--yellow)}.day.today:not(.done):not(.partial){background:rgba(255,88,98,.13);box-shadow:inset 0 0 0 2px var(--red);color:var(--red)}.legend{display:flex;align-items:center;justify-content:center;gap:22px;font-size:16px;font-weight:650;color:#b9bbc3;margin-top:17px}.legend span{display:flex;align-items:center;gap:7px}.dot{width:11px;height:11px;border-radius:4px;background:var(--green)}.dot.partial{background:var(--yellow)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:12px}.overlay.open{display:flex}.sheet{background:#1a1b21;border:1px solid #37383d;border-radius:28px 28px 24px 24px;width:min(100%,500px);padding:24px 22px max(28px,env(safe-area-inset-bottom));box-shadow:0 10px 80px #000}.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:26px}.sheet h2{margin:0;font-size:27px;font-weight:900;letter-spacing:-1px}.close{background:#303138;color:#fff;border:0;width:44px;height:44px;border-radius:14px;font-size:26px}.switch-line{display:flex;align-items:center;justify-content:space-between;gap:15px;font-size:22px;font-weight:800;margin:20px 0 18px}.switch{width:70px;height:43px;background:#45464d;border:0;border-radius:30px;position:relative;flex-shrink:0}.switch::before{content:"";position:absolute;width:33px;height:33px;top:5px;left:5px;background:white;border-radius:50%;transition:transform .2s}.switch.on{background:var(--green)}.switch.on::before{transform:translateX(27px)}.time-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0 20px}.time-row label{display:block;color:#a5a5b0;margin-bottom:8px;font-size:16px;font-weight:700}.time-row input{width:100%;height:52px;padding:7px 6px;font-size:18px;font-weight:750;text-align:center;border:1px solid #44454c;border-radius:13px;color:#fff;background:#26272e;color-scheme:dark}.big-btn{border:0;background:#fff;color:#141416;border-radius:16px;padding:16px;width:100%;font-weight:850;font-size:20px}.notice{margin-top:18px;line-height:1.5;color:#a7a8b1;font-size:16px;font-weight:550}.toast{position:fixed;bottom:32px;left:50%;transform:translate(-50%,25px);background:#292b31;color:#fff;padding:14px 20px;border-radius:16px;opacity:0;pointer-events:none;transition:.2s;min-width:180px;text-align:center;font-size:17px;font-weight:700;z-index:100;box-shadow:0 7px 25px #000a}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:600px){.app{padding-top:12px}.hero{min-height:375px}}@media(max-width:370px){.app{padding-left:16px;padding-right:16px}.calendar-card{padding-left:10px;padding-right:10px}.calendar-head h2{font-size:22px}.month-controls{gap:3px}.month-controls span{min-width:78px;font-size:17px}.set-btn{font-size:18px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}

/* Exercise guide: optional, never crowds the minimal home screen. */
.exercise-entry{width:100%;display:flex;align-items:center;justify-content:space-between;margin-top:14px;min-height:57px;padding:12px 18px;background:transparent;border:1px solid #34353b;border-radius:17px;color:#f0f0f2;font-size:19px;font-weight:800;letter-spacing:-.45px}
.exercise-entry .entry-end{display:flex;align-items:center;gap:10px;color:#a3a4ae;font-size:17px;font-weight:700}.exercise-entry svg{width:22px;height:22px}
.exercise-overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.83);display:none;align-items:flex-end;justify-content:center}.exercise-overlay.open{display:flex}
.exercise-sheet{background:#17181d;border:1px solid #32343c;border-bottom:0;border-radius:27px 27px 0 0;width:min(100%,510px);height:min(738px,calc(100dvh - 30px));display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 70px #000a;padding-bottom:env(safe-area-inset-bottom)}
.exercise-top{display:flex;align-items:center;justify-content:space-between;min-height:83px;padding:17px 19px 10px 22px;gap:10px}
.exercise-title{font-size:29px;font-weight:900;letter-spacing:-1.2px;margin:0;line-height:1.17}.exercise-back{border:0;background:#2a2c33;color:#fff;border-radius:13px;width:43px;height:43px;display:none;place-items:center;flex-shrink:0}.exercise-back.visible{display:grid}.exercise-back svg{width:24px;height:24px}
.exercise-close{border:0;background:#2b2d34;color:#fff;width:43px;height:43px;border-radius:13px;font-size:29px;display:grid;place-items:center;flex-shrink:0}.exercise-list{padding:8px 20px 24px;overflow:auto;flex:1}.exercise-row{border:1px solid #34353e;background:#202127;width:100%;min-height:87px;border-radius:18px;display:flex;align-items:center;gap:16px;text-align:left;padding:13px 17px;margin:0 0 10px;color:white}.exercise-num{font-weight:900;font-size:26px;color:#fb6269;width:28px;flex-shrink:0}.exercise-label{flex:1;display:flex;flex-direction:column;gap:4px}.exercise-label strong{font-weight:850;font-size:23px;letter-spacing:-.8px}.exercise-label em{font-style:normal;font-size:17px;color:#bfc0c8;font-weight:700}.exercise-chevron{font-size:30px;color:#a2a2ad;font-weight:350}
.exercise-detail{padding:0 18px 22px;display:none;flex:1;min-height:0;flex-direction:column}.exercise-detail.visible{display:flex}
.exercise-counter{font-size:18px;font-weight:750;color:#a8a9b0;margin:1px 0 12px 3px}.exercise-stage{position:relative;background:#0d1017;border:1px solid #292c36;border-radius:23px;overflow:hidden;flex:none;aspect-ratio:10/7;display:grid;place-items:center}.exercise-stage canvas{width:100%;height:100%;display:block}.exercise-animation-tag{position:absolute;left:15px;top:13px;display:flex;align-items:center;gap:7px;background:#252831d9;border-radius:9px;padding:6px 10px;color:#e0e2e7;font-weight:750;font-size:14px}.pulse-dot{width:7px;height:7px;background:#ff5c66;border-radius:50%;box-shadow:0 0 0 3px #ff5c6623}
.exercise-demo-name{margin:19px 4px 2px;font-size:32px;line-height:1.2;font-weight:900;letter-spacing:-1.2px}.exercise-demo-reps{font-size:24px;font-weight:850;color:#ff626d;margin:0 4px 8px}.exercise-tip{margin:0 4px;color:#c0c1c8;font-size:18px;font-weight:650;line-height:1.45}.exercise-next{margin-top:auto;min-height:60px;border:0;border-radius:17px;background:#f3f3f5;color:#141419;font-weight:900;font-size:20px}
@media(max-height:720px){.exercise-sheet{height:calc(100dvh - 15px)}.exercise-top{min-height:66px}.exercise-stage{aspect-ratio:10/5.9}.exercise-demo-name{margin-top:10px}.exercise-next{min-height:52px}}
@media(max-width:365px){.exercise-row{min-height:74px}.exercise-label strong{font-size:21px}.exercise-stage{aspect-ratio:10/6.5}.exercise-demo-name{font-size:29px}}
@media(prefers-reduced-motion:reduce){.pulse-dot{box-shadow:none}}

/* The existing character stays the same; only small, calm idle movement is added. */
@keyframes mascotIdle {
  0%,100% {transform: translateY(0) rotate(-0.5deg)}
  50% {transform: translateY(-5px) rotate(0.6deg)}
}
@keyframes mascotBlink {
  0%,43%,46%,100% {transform:scaleY(1)}
  44.4%,45% {transform:scaleY(.09)}
}
@keyframes mascotSpark {
  0% {transform:translateY(0) scale(1)}
  40% {transform:translateY(-9px) scale(1.04)}
  100% {transform:translateY(0) scale(1)}
}
.character {animation:mascotIdle 3.8s ease-in-out infinite;transform-origin:50% 55%}
.character .eye, .character .shine {transform-box:fill-box;transform-origin:center;animation:mascotBlink 6.5s ease-in-out infinite}
.hero.celebrate .character {animation:mascotSpark .75s ease-out 1}
.hero[data-state="done"] .cheek {opacity:.22}
@media(prefers-reduced-motion:reduce) {
  .character, .character .eye, .character .shine,
  .hero.celebrate .character {animation:none!important}
}


/* Editable calendar days, with a separate save/cancel sheet. */
.days .day:not(.blank){border:0;padding:0;width:100%;font:inherit;cursor:pointer;background:transparent}
.days .day:not(.blank).partial{background:rgba(248,198,75,.16)}
.days .day:not(.blank).done{background:var(--green)}
.days .day:not(.blank).today:not(.done):not(.partial){background:rgba(255,88,98,.13)}
.days .day:disabled{cursor:default}
.days .day:focus-visible{outline:2px solid #fff;outline-offset:2px}
.calendar-hint{text-align:center;color:#989aa4;font-size:14px;font-weight:650;margin:14px 0 0}
.day-edit-overlay{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.76);display:none;align-items:flex-end;justify-content:center;padding:12px}
.day-edit-overlay.open{display:flex}
.day-edit-sheet{background:#1a1b21;border:1px solid #37383e;border-radius:28px;width:min(100%,500px);padding:24px 20px max(25px,env(safe-area-inset-bottom));box-shadow:0 12px 80px #000b}
.day-edit-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.day-edit-title{font-size:25px;font-weight:900;letter-spacing:-.8px;margin:0}
.day-edit-help{color:#a7a9b2;font-weight:650;font-size:16px;margin:12px 0 22px}
.day-edit-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.day-edit-option{min-width:0;height:69px;border-radius:15px;border:2px solid #393b44;background:#24262d;color:#d2d3db;font-size:17px;font-weight:850}
.day-edit-option.chosen{border-color:var(--green);background:rgba(72,220,136,.13);color:var(--green)}
.day-edit-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.day-edit-actions button{min-height:55px;border-radius:15px;border:0;font-size:18px;font-weight:850}
.day-edit-cancel{background:#313239;color:#fff}
.day-edit-save{background:#f5f5f6;color:#14151a}


/* 3SET illustration cards: fixed poses cross-fade, never interpolate body joints. */
.exercise-stage .pose-visual{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}
.guide-panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;will-change:opacity}
.guide-panel.start{animation:guideStart 5.2s ease-in-out infinite}
.guide-panel.finish{animation:guideFinish 5.2s ease-in-out infinite}
.guide-panel.single{opacity:1}
@keyframes guideStart{0%,43%{opacity:1}49%,94%{opacity:0}100%{opacity:1}}
@keyframes guideFinish{0%,43%{opacity:0}49%,94%{opacity:1}100%{opacity:0}}
.guide-panel svg{display:block;width:100%;height:100%;max-height:100%;flex:1;overflow:visible}
.guide-phase-caption{position:absolute;right:14px;bottom:12px;padding:7px 11px;border:1px solid #424856;background:rgba(17,20,29,.88);color:#f5f6f8;border-radius:10px;font-size:14px;font-weight:800;letter-spacing:-.1px}
.exercise-stage{background:radial-gradient(circle at 50% 35%,#202a3a 0%,#11151f 74%)}
.exercise-animation-tag{background:#222734ed;color:#c8d1df}
@media(prefers-reduced-motion:reduce){
 .guide-panel.start,.guide-panel.finish{animation:none!important}
 .guide-panel.start{opacity:1}
 .guide-panel.finish{opacity:0}
}

</style>
</head>
<body>
<div class="app">
<header>
  <h1>3SET</h1>
  <button class="bell" id="bell" aria-label="운동 알림 설정" title="운동 알림 설정">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
  </button>
</header>
<main>
  <section class="hero" id="hero" data-state="none" aria-live="polite">
    <svg class="character" viewBox="0 0 320 285" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="운동 상태에 따라 표정과 색이 변하는 캐릭터">
      <ellipse class="halo" cx="160" cy="145" rx="146" ry="132"/>
      <ellipse class="aura" cx="160" cy="145" rx="143" ry="129" fill="none" stroke-width="2" stroke-dasharray="8 13"/>
      <!-- Helmet-like ears and bold, unique mascot silhouette -->
      <path class="face" d="M70 77 C47 56 42 43 42 25 C66 32 86 42 104 53 C122 43 141 40 160 40 C180 40 199 43 217 53 C234 42 254 32 278 25 C278 45 273 60 250 78 C267 97 276 119 276 149 C276 223 225 263 160 263 C95 263 44 223 44 149 C44 118 53 94 70 77 Z"/>
      <path d="M84 82 Q160 49 237 82" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="10" stroke-linecap="round"/>
      <ellipse class="eye" cx="123" cy="157" rx="12" ry="16"/>
      <ellipse class="eye" cx="198" cy="157" rx="12" ry="16"/>
      <circle class="shine" cx="126" cy="152" r="3"/><circle class="shine" cx="201" cy="152" r="3"/>
      <path class="mouth mouth-none" d="M136 210 L184 210"/>
      <path class="mouth mouth-partial" d="M137 212 Q159 202 182 214"/>
      <path class="mouth mouth-done" d="M129 206 Q160 223 191 206"/>
      <ellipse class="cheek" cx="89" cy="189" rx="15" ry="7" opacity=".3"/><ellipse class="cheek" cx="231" cy="189" rx="15" ry="7" opacity=".3"/>
    </svg>
    <p class="status" id="status">아직 안 했어.</p>
    <p class="subtitle" id="subtitle">오늘도 보고 있다.</p>
  </section>
  <section class="check" id="check" data-state="none" aria-label="오늘 운동 세트 체크">
    <div class="section-head"><h2>오늘 몇 세트?</h2><div class="count" id="count">0 <span>/ 3</span></div></div>
    <div class="set-grid" id="sets">
      <button type="button" class="set-btn" data-set="1">1세트<span class="checkmark">✓</span></button>
      <button type="button" class="set-btn" data-set="2">2세트<span class="checkmark">✓</span></button>
      <button type="button" class="set-btn" data-set="3">3세트<span class="checkmark">✓</span></button>
    </div>
    <button class="exercise-entry" type="button" id="exerciseEntry" aria-haspopup="dialog" aria-controls="exerciseOverlay"><span>1세트 운동 보기</span><span class="entry-end">5가지 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span></button>
  </section>
  <section class="calendar-card" aria-label="운동한 날 달력">
    <div class="calendar-head">
      <h2>운동 달력</h2>
      <div class="month-controls">
        <button class="month-btn" id="prev" aria-label="이전 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m15 5-7 7 7 7"/></svg></button>
        <span id="monthText">11월</span>
        <button class="month-btn" id="next" aria-label="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg></button>
      </div>
    </div>
    <div class="weekdays" aria-hidden="true"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="days" id="days"></div>
    <div class="legend"><span><i class="dot"></i> 3세트 완료</span><span><i class="dot partial"></i> 덜 완료</span></div>
    <p class="calendar-hint">날짜를 누르면 그날의 기록을 수정할 수 있어.</p>
  </section>
</main>
</div>
<div class="day-edit-overlay" id="dayEditOverlay" aria-hidden="true">

<script>
(()=>{'use strict';
const KEY='haennya-simple-v1'; const OLD='haennya-workout-v1';
const $=id=>document.getElementById(id);
const clamp=n=>Math.max(0,Math.min(3,Number(n)||0));
const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fresh=()=>({days:{},notify:false,times:['19:00','20:30','22:00']});
function load(){try{
let saved=null;
if(window.AndroidBridge&&typeof window.AndroidBridge.readState==='function'){
  try{saved=window.AndroidBridge.readState();}catch(_ignored){}
}
let v=JSON.parse(saved||localStorage.getItem(KEY));if(v&&typeof v==='object'){return {days:(v.days&&typeof v.days==='object')?v.days:{},notify:!!v.notify,times:Array.isArray(v.times)&&v.times.length===3?v.times:['19:00','20:30','22:00']}};}catch(e){};
// Preserve any existing completed round records from the previous version when available.
let s=fresh();try{const prior=JSON.parse(localStorage.getItem(OLD));if(prior&&prior.days){for(const [date,day] of Object.entries(prior.days)){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||day.rest)continue;let n=0;for(const round of day.rounds||[]){if(['squat','pushup','climber','legraise','plank'].every(id=>round?.[id]))n++;}if(n)s.days[date]=clamp(n);}s.notify=!!prior.settings?.notices;}}catch(e){}
return s;}
let state=load();const today=dateKey();let showing=new Date().getFullYear()*12+new Date().getMonth();let toastTimer=null;
function save(){const serialized=JSON.stringify(state);
try{localStorage.setItem(KEY,serialized);}catch(e){toast('저장 공간을 확인해 줘');}
if(window.AndroidBridge&&typeof window.AndroidBridge.writeState==='function'){
 try{window.AndroidBridge.writeState(serialized);}catch(_ignored){}
}
syncNative();}
function count(){return clamp(state.days[dateKey()]);}
function currentState(){return count()===3?'done':count()>0?'partial':'none'}
function renderHero(){let n=count(),kind=currentState();$('hero').dataset.state=kind;$('check').dataset.state=kind;$('count').innerHTML=`${n} <span>/ 3</span>`;
const labels=n===0?['아직 안 했어.','오늘도 보고 있다.']:n===1?['흠…','아직 2세트 남았다.']:n===2?['흠…','이제 1세트 남았다.']:['다 했다!','오늘은 인정. 😁'];
$('status').textContent=labels[0];$('subtitle').textContent=labels[1];
document.querySelectorAll('[data-set]').forEach(btn=>{let on=Number(btn.dataset.set)<=n;btn.classList.toggle('chosen',on);btn.setAttribute('aria-pressed',String(on));});}
function renderCalendar(){const now=new Date(),year=Math.floor(showing/12),month=showing%12;
$('monthText').textContent=year===now.getFullYear()?`${month+1}월`:`${year}년 ${month+1}월`;
$('next').disabled=showing>=now.getFullYear()*12+now.getMonth();
const start=new Date(year,month,1).getDay(),end=new Date(year,month+1,0).getDate();let html='';
for(let i=0;i<start;i++)html+='<div class="day blank"></div>';
for(let d=1;d<=end;d++){const k=dateKey(new Date(year,month,d,12)),n=clamp(state.days[k]);let klass=`day ${n===3?'done':n>0?'partial':''} ${k===dateKey()?'today':''} ${k>dateKey()?'future':''}`;const future=k>dateKey();html+=`<button type="button" class="${klass.trim()}" data-date="${k}" ${future?'disabled':''} title="${k}: ${n}세트" aria-label="${year}년 ${month+1}월 ${d}일, ${n}세트${future?', 미래 날짜':' - 기록 수정'}">${d}</button>`;}
$('days').innerHTML=html;}
function render(){renderHero();renderCalendar();$('bell').classList.toggle('is-on',state.notify);$('notifSwitch').classList.toggle('on',state.notify);$('notifSwitch').setAttribute('aria-checked',String(state.notify));state.times.forEach((v,i)=>$('time'+(i+1)).value=v);$('platformNotice').textContent=window.AndroidBridge?'앱을 꺼도 알림을 예약해. 3세트를 완료하면 그날은 조용해져.':'웹 체험판은 열려 있을 때만 알림을 보낼 수 있어. 앱 종료 후에도 독촉하려면 Android 설치 앱이 필요해.';}
function choose(n){n=clamp(n);const old=count();const next=old===n?n-1:n;if(next>0)state.days[dateKey()]=next;else delete state.days[dateKey()];save();render();if(next===3&&old!==3){
  const hero=$('hero');hero.classList.remove('celebrate');void hero.offsetWidth;
  hero.classList.add('celebrate');
  setTimeout(()=>hero.classList.remove('celebrate'),780);
  toast('오늘 운동 완료!');
}}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500);}
function syncNative(){if(!window.AndroidBridge?.syncReminders)return;try{window.AndroidBridge.syncReminders(JSON.stringify({enabled:state.notify,slots:state.times,nag:'spicy',completedDate:count()===3?dateKey():'',countDate:dateKey(),doneCount:count(),restDate:''}));}catch(e){}}
function openSettings(open){$('overlay').classList.toggle('open',open);document.body.style.overflow=open?'hidden':'';if(open)$('close').focus();else $('bell').focus();}
async function toggleNotify(){state.notify=!state.notify;if(state.notify&&window.AndroidBridge?.requestNotificationPermission){window.AndroidBridge.requestNotificationPermission();}else if(state.notify&&'Notification' in window&&window.isSecureContext&&Notification.permission==='default'){try{await Notification.requestPermission();}catch(e){}}save();render();toast(state.notify?'독촉 알림 켰어':'독촉 알림 껐어');}
const messages=['했냐? 아직 3세트 남았다.','했냐? 아직도 미완료야.','했냐? 오늘 끝내고 자자.'];
function sendWebNotification(index){if(!state.notify||count()===3||window.AndroidBridge)return;if(!('Notification' in window)||!window.isSecureContext||Notification.permission!=='granted')return;try{new Notification('3SET',{body:messages[index]||messages[0],tag:'haennya-'+dateKey()+'-'+index});}catch(e){}}
function webTick(){if(window.AndroidBridge||!state.notify||count()===3)return;const now=new Date(),hhmm=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;state.times.forEach((time,i)=>{let key='haennya-last-'+dateKey()+'-'+i;if(time===hhmm&&localStorage.getItem('haennya-last-notify')!==key){localStorage.setItem('haennya-last-notify',key);sendWebNotification(i);}});}

let editingDate=null,editedSets=0;
function showEditedSelection(){
 document.querySelectorAll('[data-edit-count]').forEach(btn=>{
  const active=Number(btn.dataset.editCount)===editedSets;
  btn.classList.toggle('chosen',active);btn.setAttribute('aria-pressed',String(active));
 });
}
function openDayEditor(key){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(key)||key>dateKey())return;
 const [year,month,day]=key.split('-').map(Number);
 if(dateKey(new Date(year,month-1,day,12))!==key)return;
 editingDate=key;editedSets=clamp(state.days[key]);
 $('dayEditTitle').textContent=`${year}년 ${month}월 ${day}일`;
 $('dayEditOverlay').classList.add('open');
 $('dayEditOverlay').setAttribute('aria-hidden','false');
 document.body.style.overflow='hidden';
 showEditedSelection();
 document.querySelector(`[data-edit-count="${editedSets}"]`)?.focus();
}
function closeDayEditor(){
 const previousDate=editingDate;
 editingDate=null;
 $('dayEditOverlay').classList.remove('open');
 $('dayEditOverlay').setAttribute('aria-hidden','true');
 document.body.style.overflow='';
 if(previousDate)document.querySelector(`#days [data-date="${previousDate}"]`)?.focus();
}
function saveDayEdit(){
 if(!editingDate||editingDate>dateKey())return;
 const key=editingDate,old=clamp(state.days[key]);
 if(editedSets===0)delete state.days[key];else state.days[key]=editedSets;
 closeDayEditor();
 if(old!==editedSets){
  save();render();
  toast(`${Number(key.slice(5,7))}월 ${Number(key.slice(8,10))}일 기록 저장했어`);
 }else toast('변경 없이 닫았어');
}
$('days').addEventListener('click',e=>{
 const btn=e.target.closest('button[data-date]');
 if(btn&&!btn.disabled)openDayEditor(btn.dataset.date);
});
$('dayEditOptions').addEventListener('click',e=>{
 const btn=e.target.closest('button[data-edit-count]');
 if(!btn||!editingDate)return;
 editedSets=clamp(btn.dataset.editCount);showEditedSelection();
});
$('dayEditClose').addEventListener('click',closeDayEditor);
$('dayEditCancel').addEventListener('click',closeDayEditor);
$('dayEditSave').addEventListener('click',saveDayEdit);
$('dayEditOverlay').addEventListener('click',e=>{if(e.target===$('dayEditOverlay'))closeDayEditor()});
document.addEventListener('keydown',e=>{
 if(!$('dayEditOverlay').classList.contains('open'))return;
 if(e.key==='Escape'){e.preventDefault();closeDayEditor();}
});

$('sets').addEventListener('click',e=>{const btn=e.target.closest('[data-set]');if(btn)choose(btn.dataset.set)});
$('prev').addEventListener('click',()=>{showing--;renderCalendar();});$('next').addEventListener('click',()=>{const n=new Date();showing=Math.min(showing+1,n.getFullYear()*12+n.getMonth());renderCalendar();});
$('bell').addEventListener('click',()=>openSettings(true));$('close').addEventListener('click',()=>openSettings(false));$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))openSettings(false)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').classList.contains('open'))openSettings(false)});
$('notifSwitch').addEventListener('click',toggleNotify);
state.times.forEach((t,i)=>$('time'+(i+1)).addEventListener('change',e=>{let v=e.target.value;if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(v))return;state.times[i]=v;save();toast('알림 시간 저장했어');}));
$('testNotif').addEventListener('click',async()=>{if(window.AndroidBridge?.showTestNotification){window.AndroidBridge.showTestNotification();return;}if(!('Notification' in window)||!window.isSecureContext){toast('웹 알림은 HTTPS에서만 테스트 가능');return;}let permission=Notification.permission;if(permission!=='granted')permission=await Notification.requestPermission();if(permission==='granted'){new Notification('3SET',{body:'이게 테스트야. 오늘 3세트 했냐?'});toast('테스트 알림 보냈어');}else toast('알림 권한을 허용해 줘');});
window.addEventListener('focus',()=>{const n=new Date();if(dateKey()!==today){showing=n.getFullYear()*12+n.getMonth()}render();webTick()});
render();save();setInterval(webTick,30000);
// Hosted pages can refresh in place without a fresh APK installation.
const SITE_BUILD='2026.11.23.8';let lastUpdateCheck=0;
async function checkForSiteUpdate(){
 if(location.protocol!=='https:' || !navigator.onLine || document.hidden)return;
 if(Date.now()-lastUpdateCheck<60000)return;
 lastUpdateCheck=Date.now();
 try{const r=await fetch('./version.json?t='+Date.now(),{cache:'no-store'});
   if(!r.ok)return;const info=await r.json();
   if(info.version && info.version!==SITE_BUILD){
     const next=new URL('./index.html',location.href);next.searchParams.set('v',info.version);
     location.replace(next.href);
   }
 }catch(_ignored){}
}
setTimeout(checkForSiteUpdate,3000);
setInterval(checkForSiteUpdate,300000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkForSiteUpdate();});if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>

  plank:'<path d="M169 102 H270" stroke="#9ce3bb" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>'
 };
 let arms=limb(p.shoulder,p.elbow,13,armShade)+limb(p.elbow,p.hand,12,'#efc3a3');
 if(mode==='legraise')arms=limb(p.shoulder,p.elbow,13,armShade)+limb(p.elbow,p.hand,12,'#efc3a3');
 const neck=[p.shoulder[0]+(p.faceRight?0:-15),p.shoulder[1]-18];
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" aria-hidden="true" focusable="false">
  <rect width="400" height="260" fill="transparent"/>${ground}
  ${leg(farHip,p.backKnee,p.backAnkle,true)}
  ${limb(p.hip,p.shoulder,32,'#f26f79')}
  ${leg(p.hip,p.knee,p.ankle,false)}
  ${arms}${limb(p.shoulder,neck,12,'#efc3a3')}${head}
  ${arrows[mode]||''}
 </svg>`;
}
function stop(){stage.replaceChildren();}
function start(){
 stop();const workout=workouts[selected];if(!workout)return;
 const poses=fixed[workout.key];const single=poses.length===1;
 stage.innerHTML=poses.map((p,i)=>`<div class="guide-panel ${single?'single':i===0?'start':'finish'}">
   ${staticPortrait(p,workout.key)}
   <div class="guide-phase-caption">${esc(p.name)}</div>
  </div>`).join('');
 stage.setAttribute('aria-label',workout.name+': '+poses.map(p=>p.name).join(', '));
}
function showList(){stop();selected=-1;list.style.display='block';detail.classList.remove('visible');back.classList.remove('visible');$('exerciseTitle').textContent='1세트 운동';list.innerHTML=workouts.map((w,i)=>`<button type="button" class="exercise-row" data-exercise="${i}"><span class="exercise-num">${i+1}</span><span class="exercise-label"><strong>${w.name}</strong><em>${w.reps}</em></span><span class="exercise-chevron" aria-hidden="true">›</span></button>`).join('');}
function showDetail(i){selected=Math.min(Math.max(i,0),workouts.length-1);const w=workouts[selected];list.style.display='none';detail.classList.add('visible');back.classList.add('visible');$('exerciseTitle').textContent='운동 방법';$('exerciseCounter').textContent=`${selected+1} / ${workouts.length}`;$('exerciseName').textContent=w.name;$('exerciseReps').textContent=w.reps;$('exerciseTip').textContent=w.tip;$('exerciseNext').textContent=selected===workouts.length-1?'목록으로':'다음 운동 →';start();}
function openGuide(){lastActive=document.activeElement;overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';showList();$('exerciseClose').focus();}
function closeGuide(){stop();overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.style.overflow='';selected=-1;lastActive?.focus?.();}
$('exerciseEntry').addEventListener('click',openGuide);
$('exerciseClose').addEventListener('click',closeGuide);
back.addEventListener('click',()=>{showList();$('exerciseClose').focus()});
list.addEventListener('click',e=>{const button=e.target.closest('[data-exercise]');if(button)showDetail(Number(button.dataset.exercise))});
$('exerciseNext').addEventListener('click',()=>{if(selected===workouts.length-1)showList();else showDetail(selected+1)});
overlay.addEventListener('click',e=>{if(e.target===overlay)closeGuide()});
document.addEventListener('keydown',e=>{if(!overlay.classList.contains('open'))return;if(e.key==='Escape'){e.preventDefault();selected>=0?showList():closeGuide()}if(e.key==='Tab'){const focusables=[...overlay.querySelectorAll('button:not([disabled])')].filter(el=>el.offsetParent!==null);const i=focusables.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();focusables.at(-1).focus()}else if(!e.shiftKey&&i===focusables.length-1){e.preventDefault();focusables[0].focus()}}});
})();
</script>
</body>
